<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposta C · Display</title>
<meta name="color-scheme" content="light dark">
<style>
@font-face { font-family: 'Space Grotesk'; src: url('fonts/space-grotesk.woff2') format('woff2'); font-weight: 300 700; }
@font-face { font-family: 'JetBrains Mono'; src: url('fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 100 800; }
:root {
  --sfondo: #f1eee5; --pannello: #ffffff; --testo: #0b0b0b; --tenue: #57534e; --bordo: #0b0b0b;
  --vuoto: #e7e2d6; --acceso: #3f6212; --caldo: #c2410c; --su-acceso: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root { --sfondo: #050505; --pannello: #101010; --testo: #f5f5f4; --tenue: #a8a29e; --bordo: #2a2a2a;
    --vuoto: #1f1f1f; --acceso: #c6ff3d; --caldo: #ff7a2f; --su-acceso: #050505; }
}
* { box-sizing: border-box; margin: 0; }
body { font-family: 'Space Grotesk', system-ui, sans-serif; background: var(--sfondo); color: var(--testo); min-height: 100vh; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum' 1, 'zero' 0; }
.app { max-width: 1280px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 20px; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto auto; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
header .data { font-size: .95rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
header .orologio { font-size: 1.1rem; font-weight: 700; color: var(--tenue); }
.btn-bordo { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--bordo); background: transparent; color: var(--testo); font: inherit; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

.griglia { display: grid; gap: 14px; }
@media (min-width: 900px) { .griglia { grid-template-columns: 1.5fr 1fr; } }
.tile { background: var(--pannello); border: 2px solid var(--bordo); border-radius: 24px; padding: 18px 20px 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; position: relative; overflow: hidden; }
.tile.grande { min-height: 340px; }
.tile .testa { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tile .nome { font-size: .85rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.tile .stato { white-space: nowrap; font-size: .85rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 2px solid currentColor; }
.cifre { font-weight: 800; letter-spacing: -.06em; line-height: .85; }
.grande .cifre { font-size: clamp(6rem, 30vw, 15rem); }
.piccola .cifre { font-size: clamp(4rem, 19vw, 7.5rem); }
.conto { font-size: clamp(1.4rem, 6vw, 2.4rem); font-weight: 700; color: var(--colore); }
.conto small { font-family: 'Space Grotesk', sans-serif; font-size: .55em; color: var(--tenue); font-weight: 600; margin-left: 6px; }
.batteria { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; height: 26px; }
.batteria i { border-radius: 4px; background: var(--vuoto); transition: background .3s; }
.batteria i.on { background: var(--colore); }
.batteria i.ora { animation: lampeggia 1s steps(2) infinite; background: var(--colore); }
@keyframes lampeggia { 50% { opacity: .35; } }
.scala { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 700; color: var(--tenue); }
.tile.ok { background: var(--acceso); color: var(--su-acceso); border-color: var(--acceso); }
.tile.ok .conto, .tile.ok .scala, .tile.ok .conto small { color: var(--su-acceso); }
.tile.ok .batteria i { background: color-mix(in srgb, var(--su-acceso) 35%, transparent); }

.info { display: flex; flex-wrap: wrap; gap: 10px; }
.info span { border: 2px solid var(--bordo); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.info b { font-family: 'JetBrains Mono', monospace; }
.btn { min-height: 64px; border-radius: 18px; border: 0; background: var(--testo); color: var(--sfondo); font: inherit; font-size: 1.2rem; font-weight: 700; letter-spacing: .02em; cursor: pointer; }
.btn.timbrato { animation: premi .3s steps(3); } @keyframes premi { 50% { transform: translateY(3px); } }
.proposta { text-align: center; color: var(--tenue); font-size: .8rem; font-weight: 600; }
:focus-visible { outline: 3px solid var(--caldo); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .batteria i.ora, .btn.timbrato { animation: none; } .batteria i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><p class="data">Ven 20 nov</p><p class="orologio mono" id="orologio">--:--:--</p></div>
    <button class="btn-bordo" id="intero" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Modalità scrivania</button>
  </header>

  <main class="griglia">
    <section class="tile grande" id="tG" aria-labelledby="nG">
      <div class="testa"><p class="nome" id="nG">Giornata maturata alle</p><p class="stato" id="statoG">IN CORSO</p></div>
      <p class="cifre mono" id="oraG">--:--</p>
      <p class="conto mono" id="contoG"></p>
      <div><div class="batteria" id="battG" aria-hidden="true"></div><div class="scala mono"><span id="daG">--:--</span><span id="aG">--:--</span></div></div>
    </section>
    <section class="tile piccola" id="tB" aria-labelledby="nB">
      <div class="testa"><p class="nome" id="nB">Buono pasto alle</p><p class="stato" id="statoB">IN CORSO</p></div>
      <p class="cifre mono" id="oraB">--:--</p>
      <p class="conto mono" id="contoB"></p>
      <div><div class="batteria" id="battB" aria-hidden="true"></div><div class="scala mono"><span id="daB">--:--</span><span id="aB">--:--</span></div></div>
    </section>
  </main>

  <div class="info" id="info"></div>
  <button class="btn" id="timbra">VADO IN PAUSA</button>
  <p class="proposta">Proposta C · Display — cifre enormi, batterie a tacche, modalità scrivania a schermo intero</p>
</div>
<script type="module">
import { avvia, coloreFase, feedback, coriandoli, schermoIntero } from './demo.js';
const $ = (s) => document.querySelector(s);
const scuro = matchMedia('(prefers-color-scheme: dark)').matches;
const TAPPE = scuro ? [[255, 122, 47], [255, 196, 47], [198, 255, 61]] : [[194, 65, 12], [161, 98, 7], [63, 98, 18]];
function batteria(el, n) { el.style.setProperty('--n', n); el.innerHTML = '<i></i>'.repeat(n); return [...el.children]; }
const segG = batteria($('#battG'), innerWidth < 600 ? 24 : 36);
const segB = batteria($('#battB'), innerWidth < 600 ? 20 : 24);
function pieno(seg, f, ok) {
  const k = Math.floor(f * seg.length);
  seg.forEach((s, i) => { s.className = i < k ? 'on' : (i === k && !ok ? 'ora' : ''); });
}
avvia((s) => {
  $('#orologio').textContent = s.now.toTimeString().slice(0, 8);
  for (const [t, f, ok, ora, conto, seg] of [['G', s.fGiornata, s.giornataOk, s.giornata, s.contoGiornata, segG], ['B', s.fBuono, s.buonoOk, s.buono, s.contoBuono, segB]]) {
    const tile = $('#t' + t);
    tile.style.setProperty('--colore', coloreFase(f, TAPPE));
    tile.classList.toggle('ok', ok);
    $('#ora' + t).textContent = ora;
    $('#stato' + t).textContent = ok ? 'MATURAT' + (t === 'G' ? 'A' : 'O') + ' ✓' : `${Math.floor(f * 100)}%`;
    $('#conto' + t).innerHTML = ok ? (t === 'G' ? 'Puoi uscire<small>buona serata</small>' : 'Fatto<small>buono pasto in tasca</small>') : `−${conto}<small>mancano</small>`;
    $('#da' + t).textContent = s.ingresso; $('#a' + t).textContent = ora;
    pieno(seg, f, ok);
  }
  const info = `<span>Ingresso <b>${s.ingresso}</b></span><span>Pausa pranzo <b>${s.pausaPranzo}′</b>${s.mancaPausa ? ` +${s.mancaPausa}′` : ' ✓'}</span>`;
  if ($('#info').innerHTML !== info) $('#info').innerHTML = info;
});
document.addEventListener('maturato', () => coriandoli(scuro ? ['#c6ff3d', '#ff7a2f', '#f5f5f4'] : ['#3f6212', '#c2410c', '#0b0b0b']));
$('#timbra').addEventListener('click', (e) => feedback(e.currentTarget));
$('#intero').addEventListener('click', (e) => schermoIntero(e.currentTarget));
</script>
</body>
</html>

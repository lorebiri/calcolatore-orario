<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Time Pro</title>
<style>
:root{--bg:#0b1220;--card:#111827;--accent:#3b82f6;--accent2:#10b981;--text:#e5e7eb;--muted:#9ca3af;--danger:#ef4444}
body{margin:0;font-family:system-ui;background:linear-gradient(160deg,#0b1220,#1f2937);color:var(--text)}
.app{max-width:420px;margin:auto}
.header{padding:20px;font-size:20px;font-weight:700;transition:0.3s}


.card{
  background:var(--card);
  margin:12px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  transition: all 0.25s ease;
}


.card:hover{
  transform: translateY(-3px);
  box-shadow:0 14px 40px rgba(0,0,0,.6);
}


.label{color:var(--muted);font-size:12px}


input{
  width:100%;
  margin-top:6px;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
  background:#1f2937;
  color:white;
  transition:0.2s;
}


input:focus{
  outline:none;
  box-shadow:0 0 0 2px var(--accent);
}


.row{display:flex;gap:10px;margin-top:10px}


button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:600;
  font-size:15px;
  color:white;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  cursor:pointer;
  transition: all 0.2s ease;
}


button:hover{
  transform: translateY(-2px) scale(1.02);
  box-shadow:0 6px 18px rgba(59,130,246,0.5);
}


button:active{
  transform:scale(0.96);
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
}


.progress{height:22px;background:#1f2937;border-radius:12px;overflow:hidden;margin-top:12px}


.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent2),#22c55e);
  transition:width 0.6s ease;
}


.kpi{font-size:22px;font-weight:bold;margin-top:10px}
.small{color:var(--muted);font-size:13px}
.loss{color:var(--danger);font-weight:bold}


footer{
  text-align:center;
  color:#6b7280;
  font-size:12px;
  margin:15px;
  opacity:0.7;
  transition:0.3s;
}


footer:hover{
  opacity:1;
}
</style>
</head>
<body>
<div class="app">
<div class="header">⏱️ Work Time Pro</div>

<div class="card">
<div class="label">Ingresso</div>
<input type="time" id="startTime">
</div>

<div class="card">
<div class="label">Uscite</div>
<div id="breaks"></div>
<button onclick="addBreak()">+ Aggiungi pausa</button>
</div>

<div class="card">
<button onclick="calcola()">Avvia</button>
</div>

<div class="card">
<div class="label">Progresso</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="perc" class="small"></div>
</div>

<div class="card">
<div class="kpi" id="fine"></div>
<div class="small" id="fineCountdown"></div>
</div>

<div class="card">
<div class="kpi" id="buono"></div>
<div class="small" id="buonoCountdown"></div>
</div>

<div class="card">
<div class="loss" id="lossNow"></div>
</div>


<footer>Sviluppato da Lorenzo Birindelli</footer>
</div>

<script>
function addBreak(){
  const d=document.createElement("div");
  d.className="row";
  d.innerHTML=`<input type="time"><input type="time">`;
  document.getElementById("breaks").appendChild(d);
}

function t2m(t){const[a,b]=t.split(":").map(Number);return a*60+b}
function m2t(m){return String(Math.floor(Math.max(m,0)/60)).padStart(2,'0')+":"+String(Math.max(m,0)%60).padStart(2,'0')}


let startM=0, workDone=0;
const target=432;
let fineT=0, buonoT=0;


function calcola(){
  const s=document.getElementById("startTime").value;
  if(!s)return alert("Inserisci ora");

  startM=t2m(s);
  workDone=0;
  let current=startM;


  document.querySelectorAll(".row").forEach(r=>{
    let ex=r.children[0].value;
    let en=r.children[1].value;
    if(ex&&en){
      let e=t2m(ex);
      let ri=t2m(en);
      if(e>current) workDone+=e-current;
      current=ri;
    }
  });

  fineT=current+(target-workDone);
  buonoT=current+(372-workDone);


  document.getElementById("fine").innerText="Fine: "+m2t(fineT);
  document.getElementById("buono").innerText="Buono: "+m2t(buonoT);

  live();
}

function live(){
  setInterval(()=>{
    let now=new Date();
    let m=now.getHours()*60+now.getMinutes();


    let liveWork = workDone;
    if(m>startM) liveWork += (m-startM);


    let remaining = target - liveWork;

    let prog=(liveWork/target)*100;
    document.getElementById("bar").style.width=Math.min(100,prog)+"%";
    document.getElementById("perc").innerText="Lavoro: "+m2t(liveWork)+" / 07:12";

    let rf=fineT-m;
    let rb=buonoT-m;

    document.getElementById("fineCountdown").innerText = rf>0?"Fine tra "+m2t(rf):"✅ Fine";
    document.getElementById("buonoCountdown").innerText = rb>0?"Buono tra "+m2t(rb):"🍽️ OK";

    document.getElementById("lossNow").innerText =
      remaining>0
      ? "Se esci ora perdi: "+m2t(remaining)+" ore"
      : "✅ Hai completato la giornata";

  },1000);
}
</script>
</body>

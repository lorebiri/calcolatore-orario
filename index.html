<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Work Time Tracker</title>

<style>
    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        font-family:Inter, Arial, sans-serif;
        background:#0f172a;
        color:white;
        min-height:100vh;
        padding:20px;
    }

    .container{
        max-width:900px;
        margin:auto;
    }

    h1{
        margin-top:0;
        font-size:32px;
    }

    .subtitle{
        opacity:0.7;
        margin-bottom:30px;
    }

    .grid{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
        gap:20px;
    }

    .card{
        background:rgba(255,255,255,0.06);
        border:1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
        border-radius:24px;
        padding:20px;
        transition:0.25s ease;
        animation:fadeIn 0.4s ease;
    }

    .card:hover{
        transform:translateY(-3px);
        border-color:#3b82f6;
    }

    label{
        display:block;
        margin-bottom:10px;
        font-weight:600;
    }

    input[type="time"]{
        width:100%;
        padding:14px;
        border:none;
        border-radius:14px;
        background:#1e293b;
        color:white;
        font-size:16px;
    }

    button{
        border:none;
        background:#2563eb;
        color:white;
        padding:14px 18px;
        border-radius:14px;
        cursor:pointer;
        font-weight:bold;
        transition:0.2s ease;
    }

    button:hover{
        transform:scale(1.03);
        background:#3b82f6;
    }

    .danger{
        background:#dc2626;
    }

    .uscita{
        margin-top:15px;
        padding:15px;
        background:#111827;
        border-radius:16px;
    }

    .uscita-grid{
        display:grid;
        grid-template-columns:1fr 1fr auto;
        gap:10px;
        align-items:end;
    }

    .metric{
        font-size:28px;
        font-weight:bold;
        margin-top:10px;
    }

    .small{
        opacity:0.7;
        font-size:14px;
    }

    .progress-container{
        width:100%;
        height:24px;
        background:#1e293b;
        border-radius:999px;
        overflow:hidden;
        margin-top:20px;
    }

    .progress-bar{
        height:100%;
        width:0%;
        background:linear-gradient(90deg,#3b82f6,#06b6d4);
        transition:width 1s linear;
    }

    .warning{
        color:#fca5a5;
        font-weight:bold;
    }

    .good{
        color:#86efac;
        font-weight:bold;
    }

    footer{
        text-align:center;
        margin-top:40px;
        opacity:0.6;
        font-size:14px;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(10px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Work Time Tracker</h1>

    <div class="subtitle">
        Monitoraggio intelligente dell'orario lavorativo
    </div>

    <div class="grid">

        <div class="card">

            <label>Orario ingresso</label>

            <input type="time" id="entrata">

            <div style="margin-top:20px;">
                <button onclick="aggiungiUscita()">
                    + Aggiungi uscita
                </button>
            </div>

            <div id="usciteContainer"></div>

        </div>

        <div class="card">

            <div class="small">Tempo lavorato</div>
            <div class="metric" id="tempoLavorato">00:00</div>

            <div class="small" style="margin-top:20px;">
                Fine giornata
            </div>

            <div class="metric" id="fineGiornata">--:--</div>

            <div class="small" style="margin-top:20px;">
                Buono pasto
            </div>

            <div class="metric" id="buonoPasto">--:--</div>

        </div>

        <div class="card">

            <div class="small">Countdown fine giornata</div>

            <div class="metric" id="countdownFine">--:--</div>

            <div class="small" style="margin-top:20px;">
                Countdown buono pasto
            </div>

            <div class="metric" id="countdownBuono">--:--</div>

            <div style="margin-top:20px;" id="uscitaOraMsg"></div>

        </div>

    </div>

    <div class="card" style="margin-top:20px;">

        <div class="small">Progresso giornata</div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div style="margin-top:12px;" id="progressText">
            0%
        </div>

        <div style="margin-top:20px;" id="pausaInfo"></div>

    </div>

    <footer>
        Sviluppato da Lorenzo Birindelli
    </footer>

</div>

<script>

const LAVORO_MIN = 7 * 60 + 12;
const BUONO_MIN = 6 * 60;

let notificaBuono = false;
let notificaFine = false;

function timeToMinutes(time){

    const [h,m] = time.split(":").map(Number);

    return h * 60 + m;
}

function minutesToHHMM(min){

    min = Math.floor(min);

    let h = Math.floor(min / 60);
    let m = min % 60;

    return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

function aggiungiUscita(){

    const container = document.getElementById("usciteContainer");

    const div = document.createElement("div");

    div.className = "uscita";

    div.innerHTML = `
        <div class="uscita-grid">

            <div>
                <label>Uscita</label>
                <input type="time" class="uscitaOra">
            </div>

            <div>
                <label>Rientro</label>
                <input type="time" class="rientroOra">
            </div>

            <button class="danger" onclick="this.parentElement.parentElement.remove()">
                X
            </button>

        </div>
    `;

    container.appendChild(div);
}

function getPauseData(){

    const uscite = document.querySelectorAll(".uscita");

    let pauseTotali = 0;
    let pausaPranzoValida = false;

    uscite.forEach(el => {

        const uscita = el.querySelector(".uscitaOra").value;
        const rientro = el.querySelector(".rientroOra").value;

        if(!uscita || !rientro) return;

        const out = timeToMinutes(uscita);
        const inn = timeToMinutes(rientro);

        if(inn <= out) return;

        const durata = inn - out;

        pauseTotali += durata;

        const inizioPranzo = 12 * 60;
        const finePranzo = 15 * 60;

        if(
            out >= inizioPranzo &&
            inn <= finePranzo &&
            durata >= 30
        ){
            pausaPranzoValida = true;
        }

    });

    return {
        pauseTotali,
        pausaPranzoValida
    };
}

function aggiorna(){

    const entrata = document.getElementById("entrata").value;

    if(!entrata) return;

    const entrataMin = timeToMinutes(entrata);

    const now = new Date();

    const nowMin = now.getHours() * 60 + now.getMinutes();

    const {
        pauseTotali,
        pausaPranzoValida
    } = getPauseData();

    const penalitaFine = pausaPranzoValida ? 0 : 30;

    const penalitaBuono = pausaPranzoValida ? 0 : 30;

    let tempoLavorato =
        nowMin - entrataMin - pauseTotali - penalitaFine;

    if(tempoLavorato < 0){
        tempoLavorato = 0;
    }

    const fineGiornataMin =
        entrataMin +
        LAVORO_MIN +
        pauseTotali +
        penalitaFine;

    const buonoPastoMin =
        entrataMin +
        BUONO_MIN +
        pauseTotali +
        penalitaBuono;

    document.getElementById("tempoLavorato").innerText =
        minutesToHHMM(tempoLavorato);

    document.getElementById("fineGiornata").innerText =
        minutesToHHMM(fineGiornataMin);

    document.getElementById("buonoPasto").innerText =
        minutesToHHMM(buonoPastoMin);

    const countdownFine = fineGiornataMin - nowMin;
    const countdownBuono = buonoPastoMin - nowMin;

    document.getElementById("countdownFine").innerText =
        countdownFine > 0
            ? minutesToHHMM(countdownFine)
            : "COMPLETATO";

    document.getElementById("countdownBuono").innerText =
        countdownBuono > 0
            ? minutesToHHMM(countdownBuono)
            : "MATURATO";

    const progress =
        Math.min((tempoLavorato / LAVORO_MIN) * 100, 100);

    document.getElementById("progressBar").style.width =
        progress + "%";

    document.getElementById("progressText").innerText =
        progress.toFixed(1) + "% completato";

    const mancante = LAVORO_MIN - tempoLavorato;

    if(mancante > 0){

        document.getElementById("uscitaOraMsg").innerHTML =
            `<span class="warning">
                Se esci ora perdi: ${minutesToHHMM(mancante)}
            </span>`;

    }else{

        document.getElementById("uscitaOraMsg").innerHTML =
            `<span class="good">
                Hai completato la giornata
            </span>`;
    }

    document.getElementById("pausaInfo").innerHTML =
        pausaPranzoValida
        ? `<span class="good">
            Pausa pranzo valida rilevata automaticamente
           </span>`
        : `<span class="warning">
            Nessuna pausa pranzo valida → +30 min da recuperare
           </span>`;

    if(Notification.permission === "granted"){

        if(countdownBuono <= 0 && !notificaBuono){

            new Notification("Buono pasto maturato");

            notificaBuono = true;
        }

        if(countdownFine <= 0 && !notificaFine){

            new Notification("Giornata lavorativa completata");

            notificaFine = true;
        }
    }
}

setInterval(aggiorna, 1000);

if("Notification" in window){
    Notification.requestPermission();
}

</script>

</body>
</html>
